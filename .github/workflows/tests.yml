name: Unit tests
on: [push, pull_request]
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310-unit
          - python-version: "3.11"
            tox-env: py311-unit
          - python-version: "3.12"
            tox-env: py312-unit
          - python-version: "3.13"
            tox-env: py313-unit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run tox unit environment
        run: tox -e ${{ matrix.tox-env }}
