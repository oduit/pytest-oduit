name: Odoo 19 Integration Tests
on: [push, pull_request]

jobs:
  odoo-tests:
    runs-on: ubuntu-24.04
    env:
      PGUSER: odoo
      PGPASSWORD: odoo
      PGHOST: localhost
      PGPORT: 5432
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-virtualenv \
            libpq-dev \
            libldap2-dev \
            libsasl2-dev \
            adduser \
            fonts-dejavu-core \
            fonts-inconsolata \
            fonts-font-awesome \
            fonts-roboto-unhinted \
            gsfonts \
            libjs-underscore \
            lsb-base \
            postgresql-client \
            python3-babel \
            python3-chardet \
            python3-cryptography \
            python3-dateutil \
            python3-decorator \
            python3-docutils \
            python3-freezegun \
            python3-geoip2 \
            python3-gevent \
            python3-greenlet \
            python3-idna \
            python3-pil \
            python3-jinja2 \
            python3-libsass \
            python3-markupsafe \
            python3-num2words \
            python3-ofxparse \
            python3-passlib \
            python3-polib \
            python3-psutil \
            python3-psycopg2 \
            python3-pydot \
            python3-openssl \
            python3-pypdf2 \
            python3-rjsmin \
            python3-qrcode \
            python3-renderpm \
            python3-reportlab \
            python3-requests \
            python3-stdnum \
            python3-tz \
            python3-urllib3 \
            python3-vobject \
            python3-werkzeug \
            python3-xlsxwriter \
            python3-xlrd \
            python3-zeep \
            python3-ldap
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run Odoo 19 integration lane
        run: tox -e integration-19
